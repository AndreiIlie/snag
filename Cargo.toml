[workspace]
members = ["crates/snag-core", "crates/snag-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
libc = "0.2"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
fontdb = { version = "0.23", default-features = false, features = ["fontconfig", "memmap"] }
ttf-parser = "0.25"
png = "0.18"
serde = { version = "1", features = ["derive"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
ashpd = { version = "0.14.3", default-features = false, features = ["async-io", "screenshot", "file_chooser"] }
x11rb = { version = "0.14", features = ["image"] }
rustix = { version = "1", features = ["fs", "process", "stdio"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
percent-encoding = "2"
bytemuck = "1"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland"] }
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "wayland", "x11-dlopen", "wayland-dlopen"] }
